# On-demand E2E smoke: builds the dev-flavor debug APK, boots an Android
# emulator, and runs the StampMail login flow (maestro/stampmail/01_login.yaml)
# against the hosted dev backend (https://stampmails.sabeel.app, from
# env/dev.json) using the seeded test account baked into the flow.
#
# Deliberately workflow_dispatch-only — no schedule, no PR trigger: the repo is
# private (every minute is billed) and the flow depends on external infra (dev
# backend + Firebase Auth), so a per-PR gate would redden unrelated PRs on a
# backend blip. Trigger it before releases or after auth/backend-touching
# changes. Rationale: docs/decisions/0002-maestro-smoke-manual-dispatch.md
name: Maestro smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Login smoke (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rev_sync is consumed as a path dependency, so unlike the backend / CLI
      # submodules it must be checked out for `flutter pub get` to resolve.
      - name: Check out rev_sync submodule
        run: git submodule update --init published/rev_sync

      # Hardware acceleration for the emulator; without KVM, boot is ~10x
      # slower and regularly times out on hosted runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pin to the same Flutter SDK as .fvmrc (3.44.0). Bump both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Satisfies the google-services Gradle plugin only; at runtime the app
      # initializes Firebase from lib/firebase_options.dart, so real Firebase
      # Auth works against the dev project even with a placeholder file.
      - name: Generate placeholder google-services.json
        run: ./tool/write-ci-google-services.sh

      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          ./tool/codegen.sh

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The login flow asserts English UI copy ("Sign in"); the emulator's
      # default locale is en-US, matching the flow's expectations.
      - name: Run login smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install build/app/outputs/flutter-apk/app-dev-debug.apk
            maestro test --debug-output maestro-debug maestro/stampmail/01_login.yaml

      # Maestro writes per-step logs and failure screenshots to the
      # --debug-output directory; upload them so a red run is diagnosable.
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-smoke-debug
          path: maestro-debug
          if-no-files-found: ignore

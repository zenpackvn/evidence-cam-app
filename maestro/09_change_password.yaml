appId: com.aktechvn.quangsat
name: "09 - Change password"
---
- launchApp:
    clearState: false

- runFlow: _login_helper.yaml

# ── Navigate to Profile > Change Password ─────────────────────────────────
- tapOn:
    text: "Hồ sơ"

- assertVisible:
    text: "Hồ sơ"

- tapOn:
    text: "Đổi mật khẩu"

- assertVisible:
    text: "Đổi mật khẩu"

# ── Form fields visible ───────────────────────────────────────────────────
- assertVisible:
    text: "Mật khẩu hiện tại"

- assertVisible:
    text: "Mật khẩu mới"

- assertVisible:
    text: "Xác nhận mật khẩu mới"

# ── Validation: empty submit ──────────────────────────────────────────────
- tapOn:
    text: "Cập nhật mật khẩu"

- assertVisible:
    text: "Bắt buộc"

# ── Validation: mismatched passwords ──────────────────────────────────────
- tapOn:
    text: "Mật khẩu hiện tại"
- inputText: "TestPass123"

- tapOn:
    text: "Mật khẩu mới"
    index: 0
- inputText: "NewPass456"

- tapOn:
    text: "Xác nhận mật khẩu mới"
- inputText: "DifferentPass789"

- tapOn:
    text: "Cập nhật mật khẩu"

- assertVisible:
    text: "Mật khẩu mới không khớp."

# ── Fix confirm password ───────────────────────────────────────────────────
- tapOn:
    text: "Xác nhận mật khẩu mới"
- eraseText: 50
- inputText: "NewPass456"

- tapOn:
    text: "Cập nhật mật khẩu"

# Success: snackbar appears and navigates back
- extendedWaitUntil:
    visible:
      text: "Cập nhật mật khẩu thành công."
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: "Hồ sơ"
    timeout: 5000

# ── Verify login with new password ────────────────────────────────────────
# Sign out first
- scroll:
    direction: DOWN

- tapOn:
    text: "Đăng xuất"

- assertVisible:
    text: "Bạn có chắc muốn đăng xuất không?"

- tapOn:
    text: "Đăng xuất"

- extendedWaitUntil:
    visible:
      text: "Đăng nhập"
    timeout: 5000

# Login with old password should fail (if backend enforces it)
- tapOn:
    text: "Địa chỉ email"
- inputText: "onboarding_test@example.com"

- tapOn:
    text: "Mật khẩu"
    index: 0
- inputText: "TestPass123"

- tapOn:
    text: "Đăng nhập"

# Should see error (old password no longer valid)
- extendedWaitUntil:
    visible:
      text: "Vui lòng nhập tên đăng nhập và mật khẩu."
    timeout: 5000

# Login with new password
- tapOn:
    text: "Mật khẩu"
    index: 0
- eraseText: 50
- inputText: "NewPass456"

- tapOn:
    text: "Đăng nhập"

- extendedWaitUntil:
    visible:
      text: "Trang chủ"
    timeout: 15000

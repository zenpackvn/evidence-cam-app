appId: com.aktechvn.stampmail
name: "SM-04 · Hộp thư đến + mở thư (TC-15/16/17) — chạy sau bước claim link (run.sh)"
---
# Relaunch để inbox refetch (delta-sync ?since=)
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      text: "(?s).*Tem gần đây.*"
    timeout: 30000

- tapOn:
    text: "(?s).*Inbox.*"
- extendedWaitUntil:
    visible:
      text: "(?s).*Hộp thư đến 🌸.*"
    timeout: 10000

# Thư mới claim nằm đầu danh sách (BR-01 sắp theo thời gian)
- extendedWaitUntil:
    visible:
      text: "(?s).*Chạm để đọc thư 💌.*"
    timeout: 15000
- tapOn:
    text: "(?s).*Người gửi ẩn danh.*"
    index: 0

# Màn reveal (SM-019): phong bì → mở thư → nội dung
- extendedWaitUntil:
    visible:
      text: "(?s).*Bạn có một bức thư!.*"
    timeout: 10000
- tapOn:
    text: "Mở thư"
- extendedWaitUntil:
    visible:
      text: "(?s).*Thư e2e từ Maestro.*"
    timeout: 15000

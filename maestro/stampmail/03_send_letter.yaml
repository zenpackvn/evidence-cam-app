appId: com.aktechvn.stampmail
name: "SM-03 · Soạn + đính tem + gửi thư qua copy-link (TC-10..14)"
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "(?s).*Tem gần đây.*"
    timeout: 30000

# Vào compose qua tab Hộp thư → "Thư đã gửi" → CTA (sent-list A5.2 chưa có
# nên tab này luôn trống → CTA luôn hiện)
- tapOn:
    text: "(?s).*Inbox.*"
- extendedWaitUntil:
    visible:
      text: "Thư đã gửi"
    timeout: 10000
- tapOn:
    text: "Thư đã gửi"
- extendedWaitUntil:
    visible:
      text: "Tạo thư đầu tiên"
    timeout: 10000
- tapOn:
    text: "Tạo thư đầu tiên"

# Chọn mẫu thư Free (TC-10-001)
- extendedWaitUntil:
    visible:
      text: "(?s).*Chọn mẫu thư.*"
    timeout: 10000
- tapOn:
    text: "(?s).*Cổ điển.*"

# Soạn nội dung (TC-11)
- extendedWaitUntil:
    visible:
      text: "(?s).*Soạn thư.*"
    timeout: 10000
- tapOn:
    text: "(?s).*Gửi bạn,.*"
- inputText: "Thư e2e từ Maestro"
# nút hoàn tất (icon check) góc phải top bar — icon-only nên tap theo toạ độ
- tapOn:
    point: "91%,11%"

# Đính tem (TC-12): chọn tem đầu tiên trong lưới rồi xác nhận
- extendedWaitUntil:
    visible:
      text: "(?s).*Đính tem.*"
    timeout: 10000
- tapOn:
    point: "25%,30%"
- tapOn:
    text: "Đính tem này"

# Xem trước (TC-13) → gửi
- extendedWaitUntil:
    visible:
      text: "(?s).*Xem trước thư.*"
    timeout: 10000
- tapOn:
    text: "Gửi thư"

# Chọn kênh "Sao chép link" (copy clipboard, không mở share sheet hệ thống)
- extendedWaitUntil:
    visible:
      text: "(?s).*Sao chép link.*"
    timeout: 10000
- tapOn:
    text: "(?s).*Sao chép link.*"
- tapOn:
    text: "Tạo link & mở DM"

# Thành công (TC-14-001): link 1 lần / 7 ngày
- extendedWaitUntil:
    visible:
      text: "(?s).*Đã tạo link gửi thư!.*"
    timeout: 30000
- tapOn:
    text: "Xong"

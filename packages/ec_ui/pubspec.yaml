name: ec_ui
description: >-
  EvidenceCam design-system primitives: shared Cupertino building blocks
  (continuous-corner "squircle" shapes, tap haptics, press-to-fade tappables,
  overlay toast) used by every EvidenceCam screen. The iOS-native counterpart to
  the starter's Material `app_ui`.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Third-party.
  smooth_corner: ^1.1.1

  # The design file draws its icons from lucide; this ships the same set as a
  # font so `PenIcon` names map straight across from the `.pen` nodes.
  lucide_icons_flutter: ^3.1.15

  # `path` nodes in the design file are raw SVG geometry.
  flutter_svg: ^2.3.0

  # Mã QR vẽ tại chỗ: link mời phải hiện thành mã quét được ngay trên màn của
  # chủ shop, không đi qua máy chủ nào để sinh ảnh.
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    # Artwork the design file uses as image fills on frames.
    - assets/design/
    - assets/design/platforms/

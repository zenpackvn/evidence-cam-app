name: feature_rewards
description: >-
  StampMail Rewards feature: the Seal (Dấu) economy — balance, history, earning
  via share, and spending to unlock stickers/borders/template stamps (SM-033).
  All seal mutations are server-side; the client reads and requests. Data and
  domain layers as a self-contained workspace package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  architecture: ^0.1.0
  network: ^0.1.0
  shared_contracts: ^0.1.0
  localization: ^0.1.0

  injectable: ^3.0.0
  get_it: ^9.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.7
  injectable_generator: ^3.0.2
  test_utils: ^0.1.0

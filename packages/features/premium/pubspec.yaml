name: feature_premium
description: >-
  StampMail Premium feature: reads the user's entitlement from the server
  (RevenueCat webhook is the source of truth) and exposes it as the shared
  EntitlementReader so the stamp creator and letters can gate Premium content
  (SM-028, TD-007). The purchase/paywall flow (RevenueCat SDK) is added
  separately.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  architecture: ^0.1.0
  network: ^0.1.0
  shared_contracts: ^0.1.0
  localization: ^0.1.0

  injectable: ^3.0.0
  get_it: ^9.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.7
  injectable_generator: ^3.0.2
  test_utils: ^0.1.0

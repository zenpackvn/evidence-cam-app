name: feature_letters
description: >-
  StampMail Letters feature: compose a letter, attach stamps, create a
  one-time/7-day share link, and track sent status (SM-012..016, 021). Data and
  domain layers as a self-contained workspace package; presentation is added
  separately.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  architecture: ^0.1.0
  network: ^0.1.0
  shared_contracts: ^0.1.0
  localization: ^0.1.0
  app_ui: ^0.1.0
  app_platform: ^0.1.0
  feature_album: ^0.1.0

  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  uuid: ^4.5.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.7
  injectable_generator: ^3.0.2
  test_utils: ^0.1.0

flutter:
  assets:
    - assets/templates/
    - assets/stickers/

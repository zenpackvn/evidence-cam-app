name: feature_stamp_creator
description: >-
  Stamp creator feature (SM-005..SM-011): the 4-step wizard that turns a photo
  into a stamp — pick source, apply filters, decorate, choose a border, preview,
  and save. A self-contained workspace package (C1).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  app_ui: ^0.1.0
  app_platform: ^0.1.0
  architecture: ^0.1.0
  network: ^0.1.0
  feature_album: ^0.1.0
  localization: ^0.1.0

  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  injectable_generator: ^3.0.0
  test_utils: ^0.1.0

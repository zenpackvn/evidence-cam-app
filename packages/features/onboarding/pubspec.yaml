name: feature_onboarding
description: >-
  Onboarding feature for the Flutter starter template: a swipeable intro shown
  once on first launch, as a self-contained workspace package.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  app_ui: ^0.1.0
  storage: ^0.1.0

  # Third-party.
  injectable: ^3.0.0
  get_it: ^9.2.1
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  injectable_generator: ^3.0.2
  test_utils: ^0.1.0

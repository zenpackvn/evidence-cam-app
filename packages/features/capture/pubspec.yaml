name: feature_capture
description: >-
  Capture feature for EvidenceCam: the hands-free recording session state
  machine (RecordingSessionBloc) and on-device bill scanner, as a self-contained
  workspace package. Presentation (the record route + Flow 3 screens) still lives
  in the app shell and is relocated in a later migration step.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  analytics: ^0.1.0
  app_platform: ^0.1.0
  app_ui: ^0.1.0
  ec_ui: ^0.1.0
  localization: ^0.1.0
  database: ^0.1.0

  # Third-party.
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  google_mlkit_barcode_scanning: ^0.15.0
  path_provider: ^2.1.0
  qr_flutter: ^4.1.0
  # Container remux only (moov -> front). Never re-encodes evidence.
  ffmpeg_kit_extended_flutter: ^0.5.13

  # Ba gói này vốn là phụ thuộc gián tiếp của `camera`, khai TƯỜNG MINH vì
  # `camera_video_capture_pin.dart` kế thừa thẳng bản CameraX của Android để
  # vá một hành vi của nó. Không khai thì import ấy hỏng ngay khi ai đó dọn
  # phụ thuộc.
  camera_android_camerax: ^0.7.4
  camera_platform_interface: ^2.13.1
  cross_file: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0

flutter:

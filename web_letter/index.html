<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6BFA6" />
  <title>StampMail — Bạn có một lá thư</title>
  <style>
    /* Self-contained: no external fonts/scripts (TD-011 — light, fast page). */
    :root {
      --coral: #EC6A52;
      --coral-soft: #F6BFA6;
      --cream: #FFF7F0;
      --ink: #2A2320;
      --ink-soft: #6B5D54;
      --paper: #FFFDFA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, var(--cream), var(--coral-soft));
      color: var(--ink);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .stage { width: 100%; max-width: 460px; text-align: center; }

    /* ── Envelope open animation ─────────────────────────────────────── */
    .envelope {
      position: relative;
      width: 220px; height: 150px;
      margin: 0 auto 28px;
      cursor: pointer;
      perspective: 1000px;
    }
    .envelope .body {
      position: absolute; inset: 0;
      background: var(--coral);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(236, 106, 82, 0.35);
    }
    .envelope .flap {
      position: absolute; top: 0; left: 0; right: 0; height: 75px;
      background: var(--coral-soft);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top;
      transition: transform 0.7s ease;
      z-index: 3;
    }
    .envelope.open .flap { transform: rotateX(180deg); z-index: 1; }
    .envelope .letter {
      position: absolute; left: 12px; right: 12px; bottom: 10px;
      height: 120px; background: var(--paper);
      border-radius: 8px;
      transform: translateY(0);
      transition: transform 0.7s ease 0.25s;
      z-index: 2;
    }
    .envelope.open .letter { transform: translateY(-90px); z-index: 4; }
    .hint { color: var(--ink-soft); font-size: 14px; margin-top: 8px; }

    /* ── Revealed content ────────────────────────────────────────────── */
    .card {
      background: var(--paper);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(42, 35, 32, 0.12);
      text-align: left;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .card.show { opacity: 1; transform: translateY(0); }
    .letter-text { white-space: pre-wrap; line-height: 1.6; font-size: 17px; }
    /* A Delta paragraph. `pre-wrap` on each one preserves the sender's spacing
       the same way the flat-text fallback did. */
    .letter-text p { white-space: pre-wrap; min-height: 1.6em; }
    /* SM-013 BR-08: the sender's ruled paper, painted behind the text like the
       app's _RuledLinesPainter — same 12% ink, same line height (1.6 × 17px). */
    .letter-text.ruled {
      background-image: linear-gradient(
        to bottom,
        transparent calc(1.6em - 1px),
        rgba(42, 35, 32, 0.12) calc(1.6em - 1px),
        rgba(42, 35, 32, 0.12) 1.6em
      );
      background-size: 100% 1.6em;
    }
    .stamps { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .stamps img {
      width: 84px; height: 84px; object-fit: cover;
      border-radius: 10px; border: 3px solid #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .muted { color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
    .cta {
      display: inline-block; margin-top: 22px;
      background: var(--coral); color: #fff; text-decoration: none;
      font-weight: 600; padding: 14px 22px; border-radius: 999px;
      box-shadow: 0 10px 24px rgba(236,106,82,0.4);
    }
    .spinner {
      width: 34px; height: 34px; margin: 40px auto;
      border: 4px solid var(--coral-soft); border-top-color: var(--coral);
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .flap, .letter, .card { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div id="loading"><div class="spinner"></div><p class="muted">Đang mở thư…</p></div>

    <div id="sealed" class="hidden">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Chạm để mở thư">
        <div class="body"></div>
        <div class="letter"></div>
        <div class="flap"></div>
      </div>
      <p class="hint">Chạm vào phong bì để mở thư 💌</p>
    </div>

    <section id="content" class="card hidden">
      <!-- A div, not a p: the Delta renderer appends one <p> per paragraph, and
           a <p> may not contain another. -->
      <div class="letter-text" id="letterText"></div>
      <div class="stamps" id="stamps"></div>
      <a class="cta" id="installCta" href="#">Tải StampMail để lưu tem 📮</a>
    </section>

    <section id="error" class="card hidden">
      <h1 id="errorTitle"></h1>
      <p class="muted" id="errorBody"></p>
      <a class="cta" id="errorCta" href="#">Tải StampMail 📮</a>
    </section>
  </main>

  <script>
    // Config injected at deploy time; falls back to same-origin API + store URLs.
    var CONFIG = window.STAMPMAIL_CONFIG || {};
    var API_BASE = CONFIG.apiBase || '';
    var STORE_URL = CONFIG.storeUrl || 'https://stampmail.app/get';

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function linkId() {
      // URL form: /letter/<id> or ?id=<id>
      var m = location.pathname.match(/([A-Za-z0-9_-]{6,})\/?$/);
      if (m) return m[1];
      return new URLSearchParams(location.search).get('id') || '';
    }

    function renderLetter(data) {
      hide('loading');
      show('sealed');
      var env = document.getElementById('envelope');
      var opened = false;
      function open() {
        if (opened) return; opened = true;
        env.classList.add('open');
        setTimeout(function () {
          hide('sealed');
          fillContent(data);
          show('content');
          requestAnimationFrame(function () {
            document.getElementById('content').classList.add('show');
          });
        }, 900);
      }
      env.addEventListener('click', open);
      env.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
    }

    // ── Delta renderer (SM-013 BR-02 / BR-09) ──────────────────────────────
    //
    // `content_json.delta` is the app ↔ web-viewer contract: inline attributes
    // (bold/italic/underline/color) ride on a text op, block attributes (align)
    // ride on the newline that closes the paragraph. Colors are already
    // `#RRGGBB`, so no translation table is needed.
    //
    // Everything here builds DOM nodes and assigns `textContent`. The letter
    // body is attacker-supplied — whoever wrote the letter chose every byte —
    // so it must never reach innerHTML. Attributes are whitelisted for the same
    // reason: an unrecognised one is dropped, not passed through.

    var ALIGNMENTS = { left: 'left', center: 'center', right: 'right', justify: 'justify' };

    // Quill writes #RRGGBB, but this arrives over the wire from a client we do
    // not control. Anything else is dropped rather than handed to the CSS parser.
    function safeColor(value) {
      return (typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value)) ? value : null;
    }

    /// One inline run: a <span> carrying only the attributes we recognise.
    function inlineSpan(text, attrs) {
      var span = document.createElement('span');
      span.textContent = text;
      if (!attrs) return span;
      if (attrs.bold) span.style.fontWeight = '700';
      if (attrs.italic) span.style.fontStyle = 'italic';
      if (attrs.underline) span.style.textDecoration = 'underline';
      var color = safeColor(attrs.color);
      if (color) span.style.color = color;
      return span;
    }

    /// Splits [ops] into paragraphs. A newline inside an insert closes the
    /// current paragraph and applies that op's block attributes to it, which is
    /// what makes align per-paragraph rather than per-letter.
    function paragraphsFromDelta(ops) {
      var paragraphs = [];
      var current = [];

      function close(attrs) {
        paragraphs.push({ runs: current, attrs: attrs || null });
        current = [];
      }

      ops.forEach(function (op) {
        // Insert-only documents; an embed (image, etc.) is not part of the
        // letter contract, so anything non-string is skipped.
        if (typeof op.insert !== 'string') return;
        var pieces = op.insert.split('\n');
        pieces.forEach(function (piece, i) {
          if (piece) current.push({ text: piece, attrs: op.attributes });
          // Every split point but the last was a real newline in the source.
          if (i < pieces.length - 1) close(op.attributes);
        });
      });
      if (current.length) close(null);
      return paragraphs;
    }

    /// Renders [ops] into [host]. Returns false when there is nothing to show,
    /// so the caller can fall back to the plain text.
    function renderDelta(host, ops) {
      var paragraphs = paragraphsFromDelta(ops);
      if (!paragraphs.length) return false;
      // Quill documents always end with a newline, which closes a trailing
      // empty paragraph. Rendering it would add a blank line the sender never
      // typed.
      if (paragraphs.length > 1) {
        var last = paragraphs[paragraphs.length - 1];
        if (!last.runs.length) paragraphs.pop();
      }
      paragraphs.forEach(function (para) {
        var p = document.createElement('p');
        var align = para.attrs && ALIGNMENTS[para.attrs.align];
        if (align) p.style.textAlign = align;
        para.runs.forEach(function (run) {
          p.appendChild(inlineSpan(run.text, run.attrs));
        });
        host.appendChild(p);
      });
      return true;
    }

    /// ARGB int (Dart's Color.value) → #RRGGBB. The alpha byte is dropped: the
    /// paper is opaque in the app too.
    function paperCss(value) {
      if (typeof value !== 'number' || !isFinite(value)) return null;
      var rgb = (value & 0xFFFFFF).toString(16);
      return '#' + '000000'.slice(rgb.length) + rgb;
    }

    function fillContent(data) {
      var content = {};
      try { content = JSON.parse(data.content_json || '{}') || {}; }
      catch (_) { content = {}; }

      var host = document.getElementById('letterText');
      // Prefer the rich body; fall back to the plain text the writer always
      // sends, so a letter with unreadable formatting still shows its words.
      var rendered = Array.isArray(content.delta) && renderDelta(host, content.delta);
      if (!rendered) host.textContent = content.text || '';

      // SM-013 BR-08: the sender chose this ruling, so the recipient sees it.
      if (content.ruled === true) host.classList.add('ruled');

      // SM-013 BR-03: the sender's paper color, applied to the card the letter
      // sits on rather than the text block, matching the app's LetterPaper.
      var paper = paperCss(content.paper_color);
      if (paper) document.getElementById('content').style.background = paper;

      // `font_family` is deliberately not applied: this page ships no external
      // fonts (TD-011 — light, fast, self-contained), so honouring the token
      // would mean either a network font or a silent mismatch. The system stack
      // is the honest render until a font is bundled.

      var wrap = document.getElementById('stamps');
      (data.stamps || []).forEach(function (s) {
        var img = document.createElement('img');
        img.src = s.thumb_url || s.image_url;
        img.alt = 'Tem';
        img.loading = 'lazy';
        wrap.appendChild(img);
      });
      document.getElementById('installCta').href = STORE_URL;
    }

    function renderError(title, body) {
      hide('loading'); hide('sealed');
      document.getElementById('errorTitle').textContent = title;
      document.getElementById('errorBody').textContent = body;
      document.getElementById('errorCta').href = STORE_URL;
      show('error');
      requestAnimationFrame(function () {
        document.getElementById('error').classList.add('show');
      });
    }

    function load() {
      var id = linkId();
      if (!id) { renderError('Link không hợp lệ', 'Không tìm thấy mã thư trong đường dẫn.'); return; }
      fetch(API_BASE + '/public/letter/' + encodeURIComponent(id))
        .then(function (res) {
          return res.json().then(function (body) { return { status: res.status, body: body }; });
        })
        .then(function (r) {
          if (r.status === 200) { renderLetter(r.body); return; }
          var msg = (r.body && r.body.message) || 'Đã có lỗi xảy ra.';
          if (r.status === 410) renderError('Thư không còn khả dụng', msg);
          else if (r.status === 404) renderError('Link không hợp lệ', msg);
          else renderError('Không mở được thư', msg);
        })
        .catch(function () {
          renderError('Mất kết nối', 'Vui lòng kiểm tra mạng và thử lại.');
        });
    }

    load();
  </script>
</body>
</html>
